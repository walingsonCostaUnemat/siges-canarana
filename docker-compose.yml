services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATA_FILE: /data/dados.json
    volumes:
      - dados:/data

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORTA:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  dados:
